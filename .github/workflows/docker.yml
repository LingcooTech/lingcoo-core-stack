name: Docker Verify

on:
  push:
    branches: ['codex/stack-foundation-upgrade', 'codex/stack-foundation-convergence']
  pull_request:
    paths:
      - '.dockerignore'
      - '.node-version'
      - '.npmrc'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'drizzle/**'
      - 'package*.json'
      - 'src/**'
      - 'packages/**'
      - '.github/workflows/docker.yml'
      - 'admin-ui/**'
      - 'scripts/**'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Verify Docker image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
          tags: fd-core-stack:verify

      - name: Verify production runtime and migrations
        env:
          STACK_SMOKE_IMAGE: fd-core-stack:verify
        run: node scripts/verify-production-image.mjs
