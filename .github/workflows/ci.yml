name: CI

on:
  push:
    branches:
      - main
      - 'codex/stack-foundation-upgrade'
      - 'codex/stack-foundation-convergence'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lingcoo_stack_test
          POSTGRES_USER: stack_test
          POSTGRES_PASSWORD: stack_test_only
        ports: ['15438:5432']
        options: >-
          --health-cmd "pg_isready -U stack_test -d lingcoo_stack_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_TEST_URL: postgres://stack_test:stack_test_only@127.0.0.1:15438/lingcoo_stack_test
      REDIS_TEST_URL: redis://127.0.0.1:16379/15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install data handover encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age

      - name: Validate backend and Admin
        run: npm run check

      - name: Verify migrations and database behavior
        run: npm run test:integration

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify Admin authentication components
        run: npm run test:admin

      - name: Verify browser critical paths
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
