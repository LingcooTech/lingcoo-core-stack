services:
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    read_only: true
    init: true
    environment:
      PORT: '8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
