services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lingcoo_stack_test
      POSTGRES_USER: stack_test
      POSTGRES_PASSWORD: stack_test_only
    ports:
      - '127.0.0.1:15438:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stack_test -d lingcoo_stack_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:16379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
